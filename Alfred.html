<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alfred Assistant</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #071414;
    color: white;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    width: 90%;
    max-width: 420px;

    text-align: center;

    padding: 30px 20px;

    border-radius: 25px;

    background: #102222;

    box-shadow:
        0 0 35px rgba(0, 220, 200, 0.2);
}

h1 {
    color: #00e6d0;
    margin-bottom: 8px;
}

#status {
    color: #aaa;
    margin-bottom: 25px;
}

#mic {
    width: 110px;
    height: 110px;

    border-radius: 50%;
    border: none;

    background: #00bfae;
    color: white;

    font-size: 45px;

    cursor: pointer;

    box-shadow:
        0 0 30px rgba(0, 230, 208, 0.4);
}

#mic:active {
    transform: scale(0.95);
}

#result {
    margin-top: 25px;

    min-height: 80px;

    color: #ddd;

    line-height: 1.5;
}

</style>
</head>

<body>

<div class="box">

    <h1>ALFRED</h1>

    <div id="status">
        Ready — mic dabao 🎙️
    </div>

    <button id="mic">
        🎙️
    </button>

    <div id="result">
        Say something...
    </div>

</div>


<script>

// ===============================
// ALFRED CONFIG
// ===============================

const WORKER_URL =
"https://alfred-ai.r-khatoon-7172.workers.dev/";


// ===============================
// ELEMENTS
// ===============================

const statusText =
document.getElementById("status");

const result =
document.getElementById("result");

const mic =
document.getElementById("mic");


// ===============================
// SPEECH RECOGNITION
// ===============================

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    statusText.innerText =
    "Speech recognition is not supported.";

} else {

    const recognition =
    new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = false;

    recognition.interimResults = false;


    // ===============================
    // START LISTENING
    // ===============================

    recognition.onstart = function () {

        statusText.innerText =
        "Listening... 👂";

        mic.style.background =
        "#ff5252";
    };


    // ===============================
    // STOP LISTENING
    // ===============================

    recognition.onend = function () {

        statusText.innerText =
        "Ready — mic dabao 🎙️";

        mic.style.background =
        "#00bfae";
    };


    // ===============================
    // MICROPHONE ERROR
    // ===============================

    recognition.onerror = function (event) {

        statusText.innerText =
        "Mic error: " + event.error;

        mic.style.background =
        "#00bfae";
    };


    // ===============================
    // VOICE RESULT
    // ===============================

    recognition.onresult =
    async function (event) {

        const command =
        event.results[0][0].transcript;

        result.innerText =
        "You: " + command;

        await handleCommand(command);
    };


    // ===============================
    // MIC BUTTON
    // ===============================

    mic.onclick = function () {

        try {

            recognition.start();

        } catch (error) {

            console.log(error);
        }
    };

}


// ===============================
// SPEAK
// ===============================

function speak(text) {

    result.innerText =
    "Alfred: " + text;

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.lang = "en-IN";

    speech.rate = 1;

    speech.pitch = 1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(speech);
}


// ===============================
// ASK AI
// ===============================

async function askAI(message) {

    statusText.innerText =
    "Thinking... 🧠";

    try {

        const response =
        await fetch(WORKER_URL, {

            method: "POST",

            headers: {
                "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

                message: message

            })

        });


        const data =
        await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "AI request failed"
            );
        }


        speak(
            data.reply ||
            "Sorry bhai, answer nahi mila."
        );


    } catch (error) {

        console.error(error);

        speak(
            "Sorry bhai, AI connection mein problem aa rahi hai."
        );
    }
}


// ===============================
// COMMAND HANDLER
// ===============================

async function handleCommand(command) {

    const text =
    command.toLowerCase();


    // ===============================
    // YOUTUBE
    // ===============================

    if (
        text.includes("youtube") ||
        text.includes("you tube")
    ) {

        speak(
            "YouTube khol raha hoon."
        );

        setTimeout(function () {

            window.location.href =
            "https://www.youtube.com";

        }, 1000);

        return;
    }


    // ===============================
    // GOOGLE
    // ===============================

    if (
        text.includes("google") ||
        text.includes("search")
    ) {

        speak(
            "Google khol raha hoon."
        );

        setTimeout(function () {

            window.location.href =
            "https://www.google.com";

        }, 1000);

        return;
    }


    // ===============================
    // MAPS
    // ===============================

    if (
        text.includes("maps") ||
        text.includes("map")
    ) {

        speak(
            "Maps khol raha hoon."
        );

        setTimeout(function () {

            window.location.href =
            "https://maps.google.com";

        }, 1000);

        return;
    }


    // ===============================
    // HELLO
    // ===============================

    if (
        text.includes("hello") ||
        text.includes("hi") ||
        text.includes("hey")
    ) {

        speak(
            "Hello bhai! Kya scene hai?"
        );

        return;
    }


    // ===============================
    // NAME
    // ===============================

    if (
        text.includes("your name") ||
        text.includes("tumhara naam")
    ) {

        speak(
            "Main Alfred hoon, tumhara AI assistant."
        );

        return;
    }


    // ===============================
    // TIME
    // ===============================

    if (
        text.includes("time") ||
        text.includes("samay")
    ) {

        const now =
        new Date();

        const time =
        now.toLocaleTimeString(
            "en-IN",
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );

        speak(
            "Abhi time hai " +
            time
        );

        return;
    }


    // ===============================
    // AI FALLBACK
    // ===============================

    await askAI(command);

}

</script>

</body>
</html>
